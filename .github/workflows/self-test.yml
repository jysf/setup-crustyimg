name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

# Validates the action end-to-end on all three OS runners: install a real
# crustyimg release, then confirm --version + a trivial lint and optimize work.
jobs:
  install-and-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install crustyimg
        uses: ./
        with:
          version: v0.3.1 # a real, published release (checksum-verified by the installer)

      - name: crustyimg --version
        shell: bash
        run: crustyimg --version

      # This action is generic — it installs the binary, so any crustyimg command
      # works. We pin v0.3.1 here; `lint` ships in 0.4.0, so we exercise `optimize`
      # (present in v0.3.1) as the smoke test. With `version: latest` (once 0.4.0
      # is out) `crustyimg lint` is equally available.
      - name: optimize a clean asset (writes an output)
        shell: bash
        run: |
          set -euo pipefail
          crustyimg optimize test-assets/clean.png -o out.png
          test -f out.png
          echo "optimize produced $(wc -c < out.png) bytes"
