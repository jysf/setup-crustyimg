name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

# Validates the action end-to-end on all three OS runners: install a real
# crustyimg release (pinned and `latest`), then confirm --version, the reported
# version, and that lint and optimize both run.
jobs:
  install-and-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [v0.8.0, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install crustyimg
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: crustyimg --version
        shell: bash
        run: crustyimg --version

      # A pinned install must report exactly that version, so a wrong tag or a
      # stale cache entry can't pass unnoticed.
      - name: Pinned install reports the pinned version
        if: matrix.version != 'latest'
        shell: bash
        run: |
          set -euo pipefail
          want="crustyimg ${{ matrix.version }}"
          want="${want/ v/ }"
          got="$(crustyimg --version)"
          [ "$got" = "$want" ] || { echo "expected '$want', got '$got'"; exit 1; }

      - name: lint a clean asset (exit 0)
        shell: bash
        run: crustyimg lint test-assets/clean.png

      - name: optimize a clean asset (writes an output)
        shell: bash
        run: |
          set -euo pipefail
          crustyimg optimize test-assets/clean.png -o out.png
          test -f out.png
          echo "optimize produced $(wc -c < out.png) bytes"
